name: Check server video datasets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'App/Server*.swift'
      - 'App/RootView.swift'
      - 'server/**'
      - '.github/workflows/check-datasets.yml'
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-curl php-mbstring php-zip ffmpeg
      - run: python3 -m unittest discover -s server/tests -p 'test_*.py' -v
      - run: find server/src server/public server/bin -name '*.php' -exec php -l {} \;
  swift-types:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check iOS source types without producing an app build
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          modules=$(mktemp -d)
          xcrun swiftc -emit-module -parse-as-library -module-name MakeLORACore -target arm64-apple-ios17.0-simulator -sdk "$sdk" Sources/MakeLORACore/*.swift -emit-module-path "$modules/MakeLORACore.swiftmodule"
          xcrun swiftc -typecheck -parse-as-library -module-name MakeLORA -target arm64-apple-ios17.0-simulator -sdk "$sdk" -I "$modules" App/*.swift
