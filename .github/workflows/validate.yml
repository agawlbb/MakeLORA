name: Validate iPad app
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: swift test
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iPad app and tests
        run: xcodebuild build-for-testing -project MakeLORA.xcodeproj -scheme MakeLORA -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData -jobs 2 CODE_SIGNING_ALLOWED=NO
      - name: Test on an iPad simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPad" in d["name"]]; assert devices, "No iPad simulator available"; print(devices[0]["udid"])')
          xcodebuild test-without-building -project MakeLORA.xcodeproj -scheme MakeLORA -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/DerivedData -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Capture app preview
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPad" in d["name"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/DerivedData/Build/Products/Debug-iphonesimulator/MakeLORA.app
          xcrun simctl launch "$device" dev.makelora.app
          sleep 3
          xcrun simctl io "$device" screenshot build/iPad-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/Tests.xcresult
            build/iPad-preview.png
          retention-days: 7
