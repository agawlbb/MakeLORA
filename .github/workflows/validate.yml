name: Validate iPad app
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_app:
        description: Build and test an iPad app (leave off for source/server checks only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.build_app == true
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: swift test
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iPad app and tests
        run: xcodebuild build-for-testing -project MakeLORA.xcodeproj -scheme MakeLORA -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData -jobs 2 CODE_SIGNING_ALLOWED=NO
      - name: Test on an iPad simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPad" in d["name"]]; assert devices, "No iPad simulator available"; print(devices[0]["udid"])')
          xcodebuild test-without-building -project MakeLORA.xcodeproj -scheme MakeLORA -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/DerivedData -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Capture app preview
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPad" in d["name"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/DerivedData/Build/Products/Debug-iphonesimulator/MakeLORA.app
          xcrun simctl launch "$device" dev.makelora.app
          sleep 3
          xcrun simctl io "$device" screenshot build/iPad-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/Tests.xcresult
            build/iPad-preview.png
          retention-days: 7

  server:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-curl php-mbstring php-zip ffmpeg
      - run: python3 -m unittest discover -s server/tests -p 'test_*.py' -v
      - run: find server/src server/public server/bin -name '*.php' -exec php -l {} \;
  swift-types:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test video editing rules and core project behavior
        run: swift test
      - name: Check iOS source types without producing an app build
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          modules=$(mktemp -d)
          xcrun swiftc -emit-module -parse-as-library -module-name MakeLORACore -target arm64-apple-ios17.0-simulator -sdk "$sdk" Sources/MakeLORACore/*.swift -emit-module-path "$modules/MakeLORACore.swiftmodule"
          xcrun swiftc -typecheck -parse-as-library -module-name MakeLORA -target arm64-apple-ios17.0-simulator -sdk "$sdk" -I "$modules" App/*.swift
